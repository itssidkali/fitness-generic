  $("pl1").textContent=n<0?"":n<S.length?"Step "+(n+1)+" of "+S.length+" · "+S[n].t:"Final review";
  $("pl2").textContent=Math.round(Math.max(n,0)/S.length*100)+"% complete";
  $("bd").textContent=n<0?"About 5 min":n<S.length?(S.length-n)+" min left":n==S.length?"Almost done":"";
}
function render(q){
  var w=n<0;$("wl").style.display=w?"flex":"none";$("wr").style.display=w?"none":"";document.body.classList.toggle("wb",w);
  if(w){$("wb").textContent=Object.keys(D).length>2?"Continue where you left off":"Begin";return}
  bar();if(!q){c.style.animation="none";void c.offsetWidth;c.style.animation=""}
  c.className="card";var h,s,i,f;
  if(n<S.length&&S[n].ph){c.innerHTML=photos();return}
  if(n<S.length){s=S[n];h='<div class="cb">';
    for(i=0;i<s.f.length;i++){f=s.f[i];if(f.h&&s.f[i+1]&&s.f[i+1].h)h+='<div class="row">'+fld(f)+fld(s.f[++i])+'</div>';else h+=fld(f)}
    c.innerHTML=h+'<div class="nav"><button class="sec" onclick="go(-1)">Back</button><button class="pri" onclick="go(1)">Continue</button></div></div>';return}
  if(n==S.length){h='<div class="cb"><div class="sum">';
    S.forEach(function(s,i){var r="";if(s.ph)r=D.skip&&!P.front?'<div class="kv"><span>Photos</span><em>Will be sent privately on WhatsApp</em></div>':'<div class="th">'+PH.map(function(p){return '<i style="background-image:url('+(P[p[0]]||"")+')"></i>'}).join('')+'</div>';
      else s.f.forEach(function(f){if(has(D[f.k]))r+='<div class="kv"><span>'+f.l+'</span><em>'+esc(fmt(f))+'</em></div>'});
      h+='<div class="sc"><div class="sh"><b>'+s.t+'</b><a onclick="n='+i+';render()">Edit</a></div>'+r+'</div>'});
    c.innerHTML=h+'</div><div class="em" id="se" style="margin:0 0 4px"></div><div class="nav"><button class="sec" onclick="go(-1)">Back</button><button class="pri" id="sb" onclick="send()">Submit onboarding</button></div></div>';return}
  c.innerHTML='<div class="ok"><svg viewBox="0 0 56 56" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="28" cy="28" r="27" opacity=".4"/><path d="M17 29l8 8 14-16"/></svg><h2>Welcome, <em>'+esc(window.who||"")+'.</em></h2><p>Your onboarding is complete. Your details have reached your coach, and a confirmation is on its way to '+esc(window.mail||"your inbox")+'.</p><div class="nx"><div><b>01</b><span><strong>Personal review</strong>I will go through your answers and photos myself.</span></div><div><b>02</b><span><strong>Your plan is crafted</strong>Built around your goals, your food and your schedule.</span></div><div><b>03</b><span><strong>We begin</strong>You will hear from me with your next steps.</span></div></div><p style="font-size:13px;margin-top:22px">Can\'t see the email? Please check your spam folder.</p></div>';
}
function valid(){
  var s=S[n],ok=1,first=null,q=s.ph?[{k:"photos"}]:s.f;
  q.forEach(function(f){var el=c.querySelector('[data-f="'+f.k+'"]'),v=D[f.k],bad=0;
    if(f.k=="photos")bad=!(D.skip||(P.front&&P.left&&P.right&&P.back));
    else{if(f.r&&!has(v))bad=1;if(f.v=="phone"&&has(v)&&String(v).replace(/\D/g,"").length<8)bad=1;if(f.v=="email"&&has(v)&&!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(v).trim()))bad=1}
    if(el){el.classList.toggle("bad",!!bad)}if(bad){ok=0;if(!first)first=el}});
  if(first)first.scrollIntoView({behavior:"smooth",block:"center"});return ok;
}
function go(d){if(d>0&&n>=0&&n<S.length&&!valid())return;n+=d;render();window.scrollTo({top:0,behavior:"smooth"})}
function sections(){return S.filter(function(s){return !s.ph}).map(function(s){return{t:s.t,rows:s.f.filter(function(f){return has(D[f.k])}).map(function(f){return[f.l,fmt(f)]})}})}
function send(){
  var b=$("sb"),e=$("se");b.disabled=true;b.textContent="Submitting…";e.style.display="none";
  fetch("/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:D.name,email:D.email,goal:D.goal,skip:!!(D.skip&&!(P.front&&P.left&&P.right&&P.back)),sections:sections(),photos:P})})
  .then(function(r){return r.json().then(function(j){if(!r.ok||!j.ok)throw 0;window.who=(D.name||"").split(" ")[0];window.mail=D.email;D={};P={};save();n=S.length+1;render();window.scrollTo({top:0,behavior:"smooth"})})})
  .catch(function(){b.disabled=false;b.textContent="Try again";e.style.display="block";e.innerHTML='We couldn\'t submit just now. Please check your connection and try again.'+(COACH_WA?' <a style="text-decoration:underline;cursor:pointer" onclick="wa()">Send via WhatsApp instead</a>':'')});
}
function wa(){var o=["CLIENT ONBOARDING — "+D.name];sections().forEach(function(s){o.push("","["+s.t+"]");s.rows.forEach(function(r){o.push(r[0]+": "+r[1])})});window.open("https://wa.me/"+COACH_WA+"?text="+encodeURIComponent(o.join("\n")),"_blank")}
function comp(f,cb){var r=new FileReader();r.onload=function(){var i=new Image();i.onload=function(){var s=Math.min(1,1280/Math.max(i.width,i.height)),v=document.createElement("canvas");v.width=Math.round(i.width*s);v.height=Math.round(i.height*s);v.getContext("2d").drawImage(i,0,0,v.width,v.height);cb(v.toDataURL("image/jpeg",.78))};i.src=r.result};r.readAsDataURL(f)}
c.addEventListener("change",function(e){var t=e.target;if(t.dataset.p){var f=t.files[0],k=t.dataset.p;if(!f)return;comp(f,function(u){P[k]=u;D.skip=0;var v=$("pv-"+k);v.style.backgroundImage="url("+u+")";v.textContent="";var fe=c.querySelector('[data-f="photos"]');if(fe&&P.front&&P.left&&P.right&&P.back)fe.classList.remove("bad")})}else inp(e)});
c.addEventListener("click",function(e){var t=e.target.closest(".chip,.tile");if(!t)return;var k=t.dataset.k,v=t.dataset.v;
  if(t.dataset.m=="1"){var a=D[k]||[],i=a.indexOf(v);i>-1?a.splice(i,1):a.push(v);D[k]=a}else D[k]=D[k]==v?"":v;
  [].forEach.call(t.parentNode.children,function(x){x.classList.toggle("on",x.dataset.m=="1"?(D[k]||[]).indexOf(x.dataset.v)>-1:D[k]==x.dataset.v)});
  var fe=t.closest(".f");if(fe)fe.classList.remove("bad");save()});
function inp(e){var t=e.target;if(t.dataset&&t.dataset.k){D[t.dataset.k]=t.value;if(t.type=="range")$("rv").textContent=t.value+" / 10";var fe=t.closest(".f");if(fe&&has(t.value))fe.classList.remove("bad");save()}}
c.addEventListener("input",inp);
document.addEventListener("keydown",function(e){if(e.key!="Enter")return;var t=e.target.tagName;if(n<0){e.preventDefault();go(1)}else if(t=="INPUT"&&n<S.length&&!S[n].ph&&e.target.type!="file"){e.preventDefault();go(1)}});
render();
</script>
</body>
</html>
